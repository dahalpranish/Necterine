<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Necterine — History</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 4 L20 18 H4 Z" fill="#06210d"/></svg></div>
      Necterine
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Dashboard</a>
      <a href="history.html" class="nav-link active">History</a>
      <a href="charts.html" class="nav-link">Charts</a>
    </div>
  </div>
  <div class="nav-right">
    <div class="profile-menu" id="profileMenu">
      <button class="profile-trigger" id="profileTrigger">
        <span class="user-name">...</span>
        <div class="user-avatar">A</div>
      </button>
      <div class="profile-dropdown" id="profileDropdown">
        <div class="dropdown-user user-name">...</div>
        <div class="dropdown-label">Theme</div>
        <div class="theme-options">
          <button class="theme-dot" data-theme="green" style="background:#34c759" title="Green"></button>
          <button class="theme-dot" data-theme="red" style="background:#ff5c5c" title="Red"></button>
          <button class="theme-dot" data-theme="blue" style="background:#4aa8ea" title="Blue"></button>
        </div>
        <button class="dropdown-signout" id="signOutBtn">Sign out</button>
      </div>
    </div>
  </div>
</nav>

<div class="page">
  <div class="card">
    <div class="history-toolbar">
      <h2>History</h2>

      <input class="search-input" id="searchInput" type="text" placeholder="Search expenses...">

      <select class="dropdown" id="categoryFilter">
        <option value="all">All categories</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Housing">Housing</option>
        <option value="Health">Health</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Shopping">Shopping</option>
        <option value="Education">Education</option>
        <option value="Other">Other</option>
      </select>

      <select class="dropdown" id="dateFilter">
        <option value="all">All dates</option>
        <option value="today">Today</option>
        <option value="yesterday">Yesterday</option>
        <option value="week">A week ago</option>
        <option value="month">A month ago</option>
        <option value="custom" id="customOption" hidden>Custom</option>
      </select>

      <div class="custom-range" id="customRange">
        <div id="rangeStartHost"></div>
        <span style="color:var(--muted); font-size:12px;">to</span>
        <div id="rangeEndHost"></div>
      </div>

      <select class="dropdown" id="sortFilter">
        <option value="amount_default" selected>Sort: Amount (default)</option>
        <option value="date_asc">Sort: Date (oldest)</option>
        <option value="amount_asc">Sort: Amount (low → high)</option>
        <option value="amount_desc">Sort: Amount (high → low)</option>
      </select>
    </div>

    <table class="history-table">
      <thead>
        <tr>
          <th>Date</th>
          <th>Description</th>
          <th>Category</th>
          <th style="text-align:right">Amount</th>
        </tr>
      </thead>
      <tbody id="historyBody">
        <tr><td colspan="4"><p class="loading-text">Loading...</p></td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/datepicker.js?v=2"></script>
<script src="js/history.js"></script>
</body>
</html>
